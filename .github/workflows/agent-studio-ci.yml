name: Agent Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/jarvis-approval-installer]

jobs:
  build-agent-studio:
    name: Typecheck and build Agent Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Agent Studio
        run: pnpm --filter @workspace/agent-studio run typecheck

      - name: Build Agent Studio
        run: pnpm --filter @workspace/agent-studio run build
