name: Agent Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/jarvis-approval-installer]

jobs:
  build-agent-studio:
    name: Typecheck and build Agent Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
